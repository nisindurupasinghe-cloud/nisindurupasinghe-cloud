<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="260" rx="20" fill="#0D1117"/>

  <!-- floating code bits -->
  <text x="60" y="55" font-family="Fira Code, monospace" font-size="18" fill="#9D4EDD" opacity="0.55">01
    <animate attributeName="y" values="55;40;55" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="110" y="200" font-family="Fira Code, monospace" font-size="18" fill="#D8B4FE" opacity="0.5">{ }
    <animate attributeName="y" values="200;215;200" dur="3.4s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="50" font-family="Fira Code, monospace" font-size="18" fill="#D8B4FE" opacity="0.55">&lt;/&gt;
    <animate attributeName="y" values="50;35;50" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="40" y="130" font-family="Fira Code, monospace" font-size="16" fill="#9D4EDD" opacity="0.4">10
    <animate attributeName="y" values="130;118;130" dur="3.6s" repeatCount="indefinite"/>
  </text>

  <!-- robot antenna -->
  <line x1="205" y1="38" x2="205" y2="58" stroke="#9D4EDD" stroke-width="3" stroke-linecap="round"/>
  <circle cx="205" cy="32" r="6" fill="#D8B4FE">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- robot head -->
  <rect x="155" y="58" width="100" height="82" rx="22" fill="#241F38" stroke="#9D4EDD" stroke-width="2.5"/>
  <rect x="180" y="92" width="14" height="18" rx="6" fill="#D8B4FE">
    <animate attributeName="opacity" values="1;1;0.05;1;1" keyTimes="0;0.42;0.46;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="206" y="92" width="14" height="18" rx="6" fill="#D8B4FE">
    <animate attributeName="opacity" values="1;1;0.05;1;1" keyTimes="0;0.42;0.46;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M180,128 Q205,140 230,128" stroke="#D8B4FE" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- robot body -->
  <rect x="170" y="140" width="70" height="58" rx="14" fill="#2D2745" stroke="#9D4EDD" stroke-width="2"/>
  <circle cx="205" cy="169" r="8" fill="none" stroke="#D8B4FE" stroke-width="2">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- typing arm -->
  <path d="M238,175 Q280,175 300,205" stroke="#9D4EDD" stroke-width="6" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- laptop -->
  <rect x="300" y="200" width="190" height="14" rx="4" fill="#241F38" stroke="#9D4EDD" stroke-width="1.5"/>
  <rect x="310" y="100" width="170" height="100" rx="10" fill="#15121F" stroke="#9D4EDD" stroke-width="2.5"/>

  <rect x="325" y="118" width="0" height="6" rx="3" fill="#D8B4FE">
    <animate attributeName="width" values="0;70;70;0" keyTimes="0;0.3;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="132" width="0" height="6" rx="3" fill="#9D4EDD">
    <animate attributeName="width" values="0;95;95;0" keyTimes="0;0.3;0.85;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="146" width="0" height="6" rx="3" fill="#D8B4FE">
    <animate attributeName="width" values="0;50;50;0" keyTimes="0;0.3;0.85;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="160" width="0" height="6" rx="3" fill="#9D4EDD">
    <animate attributeName="width" values="0;80;80;0" keyTimes="0;0.3;0.85;1" dur="4s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="174" width="6" height="9" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.25;0.3;0.55;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- coffee mug -->
  <rect x="530" y="180" width="42" height="36" rx="6" fill="#2D2745" stroke="#9D4EDD" stroke-width="2"/>
  <path d="M572,188 q14,0 14,14 q0,14 -14,14" stroke="#9D4EDD" stroke-width="2.5" fill="none"/>
  <path d="M540,176 q4,-8 0,-16 q-4,-8 0,-16" stroke="#D8B4FE" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,4;0,-10;0,4" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M555,176 q4,-8 0,-16 q-4,-8 0,-16" stroke="#D8B4FE" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,4;0,-10;0,4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- caption -->
  <text x="350" y="245" font-family="Fira Code, monospace" font-size="15" fill="#D8B4FE" text-anchor="middle" opacity="0.85">console.log("building cool things");</text>
</svg>
